camera:
  index: 0
  prefer_name: 'Nexigo'
  # Native 16:9 mode: requesting 4:3 can make UVC drivers crop the sides.
  width: 1280
  height: 720
  # Digital zoom for wide-angle cameras once you sit centered (1.0 = off).
  zoom: 1.0
  # Pan the crop toward a side-placed subject, -1..1 (0 = centered).
  pan_x: 0.0
  pan_y: 0.0
inference:
  model: yolo26n-pose
  fallback_model: yolov8n-pose
  fps: 3
  conf: 0.5
  # Nose/shoulders below this are "person unclear", never scored.
  min_conf: 0.3
presence:
  away_after_seconds: 30.0
reminders:
  desk_minutes: 30.0
  sound: true
server:
  host: 127.0.0.1
  port: 8080
storage:
  db_path: posture.db
vlm:
  enabled: false
  model: qwen3-vl:4b
  every_minutes: 10
privacy:
  save_event_snapshots: false
  snapshot_dir: snapshots
